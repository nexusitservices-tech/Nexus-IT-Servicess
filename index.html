<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!--
      ASSET SPECIFICATION - FAVICON & APP ICONS
      - Format: .svg (preferred for modern browsers), .png (fallback), or .ico
      - Size: 32x32px or 64x64px (square) for favicon.
      - Apple Touch Icon: 180x180px .png
      - Note: Use a highly legible, simplified mark (symbol only, no text) with good contrast for dark/light browser tabs.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Nexus IT Services | Enterprise IT, Cloud & AI Solutions in Dubai, UAE</title>
    <meta name="description" content="Enterprise IT services, custom software, cloud & AI automation in Dubai & UAE. Simplify operations and scale faster with Nexus Tech. Book a free consultation!" />
    <meta name="keywords" content="IT services Dubai, UAE tech company, enterprise IT infrastructure, custom software development UAE, AI automation GCC, cloud solutions Dubai, cybersecurity UAE, Nexus IT Services" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="Nexus IT Services" />
    <meta name="theme-color" content="#0B1528" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexus IT Services" />
    <meta property="og:title" content="Nexus IT Services | Enterprise IT, Cloud & AI Solutions in Dubai" />
    <meta property="og:description" content="Enterprise IT services, custom software, cloud & AI automation in Dubai & UAE. Simplify operations and scale faster with Nexus Tech. Book a free consultation!" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:locale" content="en_AE" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus IT Services | Enterprise IT, Cloud & AI Solutions in Dubai" />
    <meta name="twitter:description" content="Enterprise IT services, custom software, cloud & AI automation in Dubai & UAE. Simplify operations and scale faster with Nexus Tech. Book a free consultation!" />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Structured Data (JSON-LD) for Search Engines (Google, Bing, Yahoo, Yandex) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Nexus IT Services",
      "image": "/logo.png",
      "description": "Enterprise IT services, custom software development, cloud infrastructure, and AI automation for businesses across Dubai, Abu Dhabi, and the GCC.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Dubai",
        "addressRegion": "Dubai",
        "addressCountry": "AE"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 25.2048,
        "longitude": 55.2708
      },
      "areaServed": [
        {
          "@type": "Country",
          "name": "United Arab Emirates"
        },
        {
          "@type": "Country",
          "name": "Saudi Arabia"
        }
      ],
      "knowsAbout": [
        "IT Infrastructure",
        "Cloud Solutions",
        "Custom Software Engineering",
        "AI Automation",
        "Cybersecurity",
        "Business IT Consulting"
      ],
      "priceRange": "$$"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
